# このワークフローは GitHub 認定外のアクションを使用しています。
# サードパーティによって提供されており、別途の利用規約、プライバシーポリシー、
# およびサポートドキュメントが適用されます。

# Jekyll サイトをビルドして GitHub Pages にデプロイするサンプルワークフロー
name: Deploy Jekyll site to Pages

on:
  # デフォルトブランチへの push 時に実行
  push:
    branches: ["main"]

  # Actions タブから手動実行できるようにする
  workflow_dispatch:

# GitHub Pages へのデプロイを許可するための GITHUB_TOKEN 権限設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは 1 件のみ許可し、実行中のジョブと最新の待機中ジョブの間にキューされた実行はスキップする。
# ただし、本番デプロイを完了させるため、実行中のジョブはキャンセルしない。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ビルドジョブ
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0' # .ruby-version ファイルがある場合は不要
          bundler-cache: true # 'bundle install' を実行し、インストールされた gem を自動キャッシュする
          cache-version: 0 # キャッシュ済み gem を再ダウンロードしたい場合はこの数値を増やす
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # デフォルトでは './_site' ディレクトリに出力される
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # デフォルトで './_site' ディレクトリからアーティファクトを自動アップロードする
        uses: actions/upload-pages-artifact@v5

  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
